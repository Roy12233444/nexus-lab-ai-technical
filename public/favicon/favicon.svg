<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="nexusBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c15" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="nexusStemL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="nexusStemR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="nexusDiag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="nexusGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Rounded Base -->
  <rect width="64" height="64" rx="15" fill="url(#nexusBg)" stroke="#1e293b" stroke-width="1.5" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" fill="none" />

  <!-- Geometric N Convergence -->
  <g filter="url(#nexusGlow)">
    <!-- Left Vertical Stem -->
    <path d="M16 47V17C16 15.34 17.34 14 19 14C20.66 14 22 15.34 22 17V47C22 48.66 20.66 50 19 50C17.34 50 16 48.66 16 47Z" fill="url(#nexusStemL)" />

    <!-- Right Vertical Stem -->
    <path d="M42 47V17C42 15.34 43.34 14 45 14C46.66 14 48 15.34 48 17V47C48 48.66 46.66 50 45 50C43.34 50 42 48.66 42 47Z" fill="url(#nexusStemR)" />

    <!-- High-Precision Diagonal Crossbeam -->
    <path d="M19 16L45 48" stroke="url(#nexusDiag)" stroke-width="6.5" stroke-linecap="round" />

    <!-- Quantum / Epistemic Node Core -->
    <circle cx="32" cy="32" r="5" fill="#38bdf8" />
    <circle cx="32" cy="32" r="2.2" fill="#ffffff" />
  </g>
</svg>